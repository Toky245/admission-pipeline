apiVersion: 1

datasources:
  - name: Admission (PostgreSQL)
    uid: admission-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: ${GRAFANA_DB_USER}
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
